services:
  - type: web
    name: taskvora
    env: node
    rootDirectory: services:
  - type: web
    name: taskvora
    env: node
    rootDirectory: securepass-pro/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: your-super-secret-jwt-key-change-in-production
      - key: MONGODB_URI
        value: mongodb+srv://taskvora:taskvora123@cluster0.mongodb.net/taskvora?retryWrites=true&w=majority
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: Taskvora <no-reply@taskvora.com>
    regions:
      - oregon

    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: your-super-secret-jwt-key-change-in-production
      - key: MONGODB_URI
        value: mongodb+srv://taskvora:taskvora123@cluster0.mongodb.net/taskvora?retryWrites=true&w=majority
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: Taskvora <no-reply@taskvora.com>
    regions:
      - oregon
